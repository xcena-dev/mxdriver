name: Advanced PR Check

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, edited]
  pull_request_review:
    types: [submitted, edited]

jobs:
  check-external-approvals:
    name: Check External PR Approvals
    uses: xcena-dev/.github/.github/workflows/check-external-pr-approvals.yml@main
    with:
      minimum-approvals: 1
    secrets:
      PAT_TOKEN: ${{ secrets.METISX_GIT_ACTION_ACCESS_TOKEN }}

