name: MX Driver DMA Test Suite
description: "MX Driver DMA Test Suite"
test_scope_includes:
  - .ci
schedule: "0 21 * * *"
working_repository: sdk_release
targets:
  qemu:
    - commons:
       - ssh_port: 10000
    - post:
      - success:
        - ./.ci/qemu/post.success.sh
      - failure:
        - ./.ci/qemu/post.failure.sh
    - exit:
      - ./.ci/qemu/exit.sh
  qemu_system:
    - init:
      - ./.ci/qemu/build.sh
      - ./.ci/qemu/init.sh
    - post:
      - success:
        - ./.ci/qemu/post.success.sh
      - failure:
        - ./.ci/qemu/post.failure.sh
    - exit:
      - ./.ci/qemu/exit.sh
