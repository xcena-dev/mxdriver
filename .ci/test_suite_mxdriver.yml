name: MX Driver CI Test Suite

test_scope_includes:
  - .ci
test_case_files:
  - test_case_dma_test.yml
schedule: "0 21 * * *"
description: "MX Driver CI Test Suite"
working_repository: sdk_release

targets:
  qemu:
    - backend: vmm
    - stop-on-error: true
    # The driver is a kernel module: build+install the .ko, then reboot so it
    # loads bound to the device before any test runs.
    - reboot_after_install: true
    - push:
        - { src: tests,   dst: tests }
        - { src: driver,  dst: driver }
    # sdk_release keeps the driver at driver/mxdriver, alongside driver/ccma;
    # before that move it was driver itself. Take whichever of the two carries
    # the installer, so this runs against either layout.
    #
    # Anchored at $HOME rather than the current directory: these blocks are
    # concatenated into one script, so a relative cd in the first one decides
    # where the second starts.
    - uninstall: |
        set -e
        cd "$([ -f "$HOME/driver/mxdriver/uninstall.sh" ] && echo "$HOME/driver/mxdriver" || echo "$HOME/driver")"
        sudo ./uninstall.sh
    - install: |
        set -e
        cd "$([ -f "$HOME/driver/mxdriver/install.sh" ] && echo "$HOME/driver/mxdriver" || echo "$HOME/driver")"
        sudo ./install.sh
    - commons:
        - timeout: 3600
