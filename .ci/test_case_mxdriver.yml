- name: mxdriver_dma_cxl_6_10
  command:
    - cd emulator && ./setup.sh --dev --clean
    - sudo ./run.sh --bg
    - sleep 30
    - ./ssh.sh 'cd ./sdk; ls; cd ./tests/dma_test/ && ./test.sh'
  description: "MX Driver DMA Test Case for CXL 6.10"
  version: "1.0"
  targets:
    - qemu
  tags:
    - push
    - pr

