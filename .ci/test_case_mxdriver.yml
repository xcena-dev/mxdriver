- name: "DMA Test Case for MX Driver"
  command:
    - cd emulator && ./setup.sh --dev --clean
    - sudo ./run.sh --bg
    - sleep 30
    - ./ssh.sh 'cd ./sdk; ls; cd ./tests/dma_test/ && ./test.sh'
    - ./kill_bg.sh
    - sleep 30
    - sudo ./run.sh --bg --backend mx1squarter
    - sleep 30
    - ./ssh.sh 'cd ./sdk; ls; cd ./tests/dma_test/ && ./test.sh'
  description: "MX Driver DMA Test Case"
  version: "1.0"
  targets:
    - qemu
  tags:
    - push
    - pr

- name: "qemu test"
  description: "Normal test"
  targets:
    - qemu_system
  tags:
    - push
    - pr
  setup:
    - ./.ci/qemu/tests/normal/setup.sh
  command:
    - ./.ci/qemu/tests/normal/command.sh
  teardown:
    - ./.ci/qemu/tests/normal/teardown.sh

