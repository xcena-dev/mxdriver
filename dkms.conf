PACKAGE_NAME="mx_dma"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="mx_dma"
DEST_MODULE_LOCATION[0]="/updates"

AUTOINSTALL="yes"

# CXL support. install.sh resolves it for the target and passes the make argument
# in XCENA_WO_CXL (empty when the target has CXL). Without that variable -- a
# kernel-upgrade autoinstall, or dkms invoked directly -- fall back to this
# machine's CEDT table, which is the right answer whenever the build runs on the
# machine that will load the module.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules ${XCENA_WO_CXL-$([ ! -e /sys/firmware/acpi/tables/CEDT ] && echo WO_CXL=1)}"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

POST_INSTALL="scripts/dkms-post-install.sh"
