PACKAGE_NAME="mx_dma"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="mx_dma"
DEST_MODULE_LOCATION[0]="/updates"

AUTOINSTALL="yes"

# CXL support. XCENA_TARGET_HAS_CXL is the target's answer, exported by
# install.sh. Anything that is not a yes or a no -- unset on a kernel-upgrade
# autoinstall or a direct dkms call, empty, or a typo that never went through
# install.sh's true|false check -- means no answer was given, so read this
# machine's CEDT table. That is the right answer whenever the build runs on the
# machine that will load the module, and a wrong value is not allowed to pass
# for "no CXL": dropping CXL support on hardware that has it costs an order of
# magnitude of device memory bandwidth.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules $(case "${XCENA_TARGET_HAS_CXL:-}" in true) ;; false) echo WO_CXL=1 ;; *) [ -e /sys/firmware/acpi/tables/CEDT ] || echo WO_CXL=1 ;; esac)"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

POST_INSTALL="scripts/dkms-post-install.sh"
